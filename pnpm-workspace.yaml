packages:
  - web
  - server
  - marketing
  - packages/*

allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  '@sentry/cli': true
  '@sentry/node-cpu-profiler': true
  argon2: true
  esbuild: true
  prisma: true
  puppeteer: set this to true or false
  sharp: true
  unrs-resolver: true

onlyBuiltDependencies:
  - supabase
